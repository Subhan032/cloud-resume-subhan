name: Deploy static site to S3 & Invalidate CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync site to S3
        run: |
          aws s3 sync resume/ s3://${{ secrets.S3_BUCKET_NAME }}/ --delete
          aws s3 cp resume/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html --cache-control max-age=0,public

      - name: Create CloudFront invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Invalidation created: $INVALIDATION_ID"
